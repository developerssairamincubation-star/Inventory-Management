services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-inventory_test}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: migrates the dev database, then exits 0. `app` depends on this
  # completing successfully so it can never boot against an unmigrated schema.
  flyway:
    image: flyway/flyway:10-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory}
      -user=${POSTGRES_USER}
      -password=${POSTGRES_PASSWORD}
      -connectRetries=10
      -baselineOnMigrate=true
      migrate
    restart: "no"

  # One-shot: loads dev-only seed data (super_admin user, sample category).
  # Local/dev use only — never wire this into a prod-labeled compose file.
  flyway-seed:
    image: flyway/flyway:10-alpine
    depends_on:
      flyway:
        condition: service_completed_successfully
    volumes:
      - ./db/seed:/flyway/sql
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory}
      -user=${POSTGRES_USER}
      -password=${POSTGRES_PASSWORD}
      -connectRetries=10
      -baselineOnMigrate=true
      migrate
    restart: "no"

  # One-shot: migrates the separate inventory_test database used by the
  # Vitest integration suite. Run on demand (`docker compose up flyway-test`),
  # not part of the default app startup chain.
  flyway-test:
    image: flyway/flyway:10-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./db/migrations:/flyway/sql
    command: >
      -url=jdbc:postgresql://postgres:5432/${POSTGRES_TEST_DB:-inventory_test}
      -user=${POSTGRES_USER}
      -password=${POSTGRES_PASSWORD}
      -connectRetries=10
      -baselineOnMigrate=true
      migrate
    restart: "no"

  # SMTP catcher for local password-reset email testing. Web UI at :8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  # Daily pg_dump to a volume separate from the live data volume, so a
  # corrupted pgdata volume can't also destroy the backups. See the backup
  # runbook in db/README.md for restore steps.
  pg_backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - pgbackups:/backups
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      HOSTNAME: 0.0.0.0
      # Every route now queries Postgres via Drizzle (src/db/client.ts),
      # which throws at import time if DATABASE_URL is unset — this is
      # required for the app to boot at all, not just for auth (Phase 4).
      # Container-network address (postgres:5432), not the host-side
      # localhost:5433 mapping used by `npm run dev` in .env.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventory}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER}
      # Cloudinary is a real external service (api.cloudinary.com /
      # res.cloudinary.com) reached the same way from inside this container
      # as from host-side `npm run dev` — no container-network address
      # rewriting needed, unlike the old local MinIO setup.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-dev}
      # Mailpit, container-network address (host-side `npm run dev` uses
      # .env's SMTP_HOST=localhost instead).
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      flyway:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  pgdata:
  pgbackups: