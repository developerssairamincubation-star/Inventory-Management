name: Inventory DevSecOps Security Pipeline

on:
  push:
    branches:
      - devsecops-integration

  pull_request:
    branches:
      - devsecops-integration

permissions:
  contents: read

jobs:
  security-scan:
    name: DevSecOps Security Scan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Source Code
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # 2. Secret Scanning
      - name: Run GitLeaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --verbose

      # 3. Static Application Security Testing
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=auto \
            --error \
            --exclude '.github/workflows/test.yml' \
            --exclude '.github/workflows/deploy-dit.yml' \
            --exclude 'src/contexts/UserContext.tsx' \
            --exclude 'db/seed/R__seed_dev_data.sql' \
            --exclude 'k6/seed/load-users.sql' \
            /src

       # 4. Dependency Vulnerability Scanning
      - name: Run OWASP Dependency-Check
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            owasp/dependency-check:latest \
            --scan /src \
            --format HTML \
            --format JSON \
            --out /src/dependency-check-report \
            --project "Inventory Management"    
