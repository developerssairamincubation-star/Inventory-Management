name: Inventory DevSecOps Security Pipeline

on:
  push:
    branches:
      - devsecops-integration

  pull_request:
    branches:
      - devsecops-integration

permissions:
  contents: read


# ============================================================
# DEVSECOPS JOBS
# ============================================================

jobs:

  # ==========================================================
  # JOB 1 - SECRET SCANNING
  # ==========================================================
  secret-scan:
    name: Secret Scanning - GitLeaks
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run GitLeaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --no-git \
            --verbose


  # ==========================================================
  # JOB 2 - STATIC APPLICATION SECURITY TESTING
  # ==========================================================
  sast-scan:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config=auto \
            --error \
            --exclude '.github/workflows/test.yml' \
            --exclude '.github/workflows/deploy-dit.yml' \
            --exclude 'src/contexts/UserContext.tsx' \
            --exclude 'db/seed/R__seed_dev_data.sql' \
            --exclude 'k6/seed/load-users.sql' \
            /src


  # ==========================================================
  # JOB 3 - DOCKERFILE LINTING
  # ==========================================================
  dockerfile-scan:
    name: Dockerfile Security - Hadolint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check Dockerfile Exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo "Dockerfile not found."
            exit 1
          fi
      - name: Run Hadolint
        run: |
          docker run --rm \
            -i \
            hadolint/hadolint:latest \
            hadolint \
            --failure-threshold error \
            - < Dockerfile

  # ==========================================================
  # JOB 4 - TRIVY CONFIGURATION SCANNING
  # ==========================================================
  config-scan:
    name: Configuration Security - Trivy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Trivy Config Scan
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            aquasec/trivy:latest \
            config \
            --severity HIGH,CRITICAL \
            /src


  # ==========================================================
  # JOB 5 - FILESYSTEM VULNERABILITY SCANNING
  # ==========================================================
  filesystem-scan:
    name: Filesystem Vulnerability Scan - Trivy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Trivy Filesystem Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            aquasec/trivy:latest \
            fs \
            --severity HIGH,CRITICAL \
            /workspace

         
        # ==========================================================
  # JOB 6 - CONTAINER IMAGE SECURITY SCANNING
  # ==========================================================
  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Docker Image
        run: |
          docker build \
            -t inventory-management:security-scan \
            .

      - name: Run Trivy Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            inventory-management:security-scan
