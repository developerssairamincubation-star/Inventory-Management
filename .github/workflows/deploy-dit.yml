name: Deploy DIT Environment

# Trigger the pipeline only when code is pushed to the development branch
on:
  push:
    branches: [ "development" ]

jobs:
  deploy:
    # Tell GitHub to use the local runner sitting on Node 5
    runs-on: self-hosted

    steps:
      # Step 1: Pull the latest code onto Node 5
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Materialize runtime secrets for Docker Compose on Node 3
      #
      # NOTE: this env var set changed with the Cloudinary object-storage
      # migration (MinIO is gone, replaced by a hosted Cloudinary account
      # shared with local dev — see src/lib/cloudinary.ts). Before this
      # workflow can succeed, the repo's GitHub Secrets need: POSTGRES_USER,
      # POSTGRES_PASSWORD, POSTGRES_DB, CLOUDINARY_CLOUD_NAME,
      # CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET, JWT_ACCESS_SECRET,
      # JWT_REFRESH_PEPPER — plus whatever real SMTP credentials this
      # environment should send password-reset email through (Mailpit is
      # local-dev-only, not wired into this deploy target).
      - name: Write .env file on Node 3
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DIT_SSH_HOST }}
          username: ${{ secrets.DIT_SSH_USER }}
          key: ${{ secrets.DIT_SSH_KEY }}
          script: |
            mkdir -p /opt/inventory-management-dit
            cat > /opt/inventory-management-dit/.env <<'EOF'
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            CLOUDINARY_UPLOAD_FOLDER=dit
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_PEPPER=${{ secrets.JWT_REFRESH_PEPPER }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            EOF

      # Step 3: Securely copy all project files over your local switch to Node 3
      - name: Copy files to Node 3
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DIT_SSH_HOST }}
          username: ${{ secrets.DIT_SSH_USER }}
          key: ${{ secrets.DIT_SSH_KEY }}
          source: "."
          exclude: ".env,.env.*"
          target: "/opt/inventory-management-dit"

      # Step 4: Command Node 3 to run migrations, then build and restart the containers
      - name: Execute Docker Compose on Node 3
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DIT_SSH_HOST }}
          username: ${{ secrets.DIT_SSH_USER }}
          key: ${{ secrets.DIT_SSH_KEY }}
          script: |
            cd /opt/inventory-management-dit
            docker compose -f docker-compose.yml up -d --build --remove-orphans
